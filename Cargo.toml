[workspace]
members = [
    "crates/crsu",
    "crates/crsu-testkit",
    "crates/crsu-e2e",
]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
crsu = { path = "crates/crsu" }
crsu-testkit = { path = "crates/crsu-testkit" }
httpmock = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3.15"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
