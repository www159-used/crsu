[package]
name = "crsu"
version = "0.1.0"
edition = "2024"
description = "A focused Git and Crucible review workflow CLI"
license = "AGPL-3.0-or-later"
keywords = ["git", "crucible", "code-review", "cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "crsu"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"

[dev-dependencies]
httpmock = "0.7"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tempfile = "3.15"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
