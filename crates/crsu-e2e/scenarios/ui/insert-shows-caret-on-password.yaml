name: insert mode shows caret on password
render:
  kind: text-insert
  field: password
  value: secret
  terminal:
    width: 80
    height: 20
expect:
  visible_contains:
    - "-- INSERT --"
    - "> ••••••"
    - "Password  ←"
  visible_not_contains:
    - "-- NORMAL --"
  cursor:
    x: 31
    y: 8
