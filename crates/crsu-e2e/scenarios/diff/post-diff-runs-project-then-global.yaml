name: post-diff runs the project hook before the global hook
repository:
  base_branch: main
  base_files:
    README.md: "base\n"
  feature_branch: feature
  feature_files:
    README.md: "feature\n"
  feature_message: |-
    feature change

    Summary: explain why the feature is needed
command:
  - diff
  - --yes
  - main
hooks:
  post-diff: |
    #!/bin/sh
    echo project >> .git/crsu/hooks/order.log
    cat > .git/crsu/hooks/captured.json
global_hooks:
  post-diff: |
    #!/bin/sh
    echo global >> .git/crsu/hooks/order.log
crucible:
  project: COMMON
  repository: java-common
  token: test-token
  reviewers:
    - alice
  review_id: COMMON-123
expect:
  success: true
  stdout_contains:
    - "Review: COMMON-123"
  hook_order:
    - project
    - global
  hook_json:
    version: 1
    scope: project
    event: post-diff
    command: diff
    action: created
    review_id: COMMON-123
    url: http://crucible/cru/COMMON-123
