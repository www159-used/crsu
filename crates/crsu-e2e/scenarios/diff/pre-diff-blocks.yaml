name: pre-diff hook failure refuses to submit
repository:
  base_branch: main
  base_files:
    README.md: "base\n"
  feature_branch: feature
  feature_files:
    README.md: "feature\n"
command:
  - diff
  - --yes
  - main
hooks:
  pre-diff: |
    #!/bin/sh
    echo not ready >&2
    exit 1
expect:
  success: false
  stderr_contains:
    - "pre-diff hook exited 1: not ready"
  stdout_contains:
    - "Base: main"
