name: global pre-diff failure skips the project hook
repository:
  base_branch: main
  base_files:
    README.md: "base\n"
  feature_branch: feature
  feature_files:
    README.md: "feature\n"
command:
  - diff
  - --yes
  - main
global_hooks:
  pre-diff: |
    #!/bin/sh
    mkdir -p .git/crsu/hooks
    echo global >> .git/crsu/hooks/order.log
    echo blocked >&2
    exit 1
hooks:
  pre-diff: |
    #!/bin/sh
    echo project >> .git/crsu/hooks/order.log
expect:
  success: false
  stderr_contains:
    - "pre-diff hook exited 1: blocked"
  hook_order:
    - global
