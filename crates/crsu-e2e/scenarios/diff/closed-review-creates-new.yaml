name: a closed review in HEAD starts a new review
repository:
  base_branch: main
  base_files:
    README.md: "base\n"
  feature_branch: feature
  feature_files:
    README.md: "next change\n"
  feature_message: |-
    fix: follow-up after close

    Url: http://crucible/cru/COMMON-123
command: [diff, --yes, main]
crucible:
  project: COMMON
  repository: java-common
  token: test-token
  reviewers: [alice]
  review_id: COMMON-200
  previous_review_id: COMMON-123
  previous_state: Closed
expect:
  success: true
  stdout_contains:
    - "Review: COMMON-200"
  head_body_contains:
    - "/cru/COMMON-200"
  review:
    title: "fix: follow-up after close"
    objectives: |-
      [ branch: feature ]
      [ target: main ]
      [ last_tag: None ]
    state: Review
