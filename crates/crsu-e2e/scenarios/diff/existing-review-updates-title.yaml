name: existing review receives the patch and follows the Git subject
repository:
  base_branch: main
  base_files:
    README.md: "base\n"
  feature_branch: feature
  feature_files:
    README.md: "feature\n"
  feature_message: |-
    fix: current Git title

    Summary: explain the updated patch

    Url: http://crucible/cru/COMMON-123
command:
  - diff
  - main
crucible:
  project: COMMON
  repository: java-common
  token: test-token
  review_id: COMMON-123
  current_title: "fix: old review title"
  current_objectives: |-
    [ branch: feature ]
    [ target: main ]
    [ last_tag: None ]
  current_state: Draft
expect:
  success: true
  stdout_contains:
    - "Review: COMMON-123"
    - "Title updated: fix: old review title -> fix: current Git title"
  review:
    title: "fix: current Git title"
    objectives: |-
      explain the updated patch

      [ branch: feature ]
      [ target: main ]
      [ last_tag: None ]
    state: Draft
