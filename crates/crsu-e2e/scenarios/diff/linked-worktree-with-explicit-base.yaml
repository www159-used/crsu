name: linked worktree branch accepts an explicit base
repository:
  base_branch: main
  base_files:
    README.md: "base\n"
  feature_branch: feature
  linked_worktree: true
  feature_files:
    README.md: "feature\n"
command:
  - diff
  - main
expect:
  success: true
  stdout_contains:
    - "Base: main"
    - "Commits: 1"
