name: rejected push does not run post-land
repository:
  base_branch: main
  base_files:
    README.md: "base\n"
  feature_branch: feature
  feature_files:
    README.md: "feature\n"
  feature_message: |-
    fix: land me

    Url: http://crucible/cru/COMMON-99
  origin:
    default_branch: main
command: [land, --yes]
hooks:
  pre-land: |
    #!/bin/sh
    origin_path="$(git remote get-url origin)"
    cat > "$origin_path/hooks/pre-receive" <<'HOOK'
    #!/bin/sh
    echo rejected by origin >&2
    exit 1
    HOOK
    chmod +x "$origin_path/hooks/pre-receive"
  post-land: |
    #!/bin/sh
    cat > .git/crsu/hooks/captured.json
crucible:
  project: COMMON
  token: test-token
  review_id: COMMON-99
  title: "fix: land me"
  state: Review
  objectives: |-
    [ branch: feature ]
    [ target: origin/feature ]
    [ last_tag: None ]
  reviewers:
    - username: alice
      completed: true
expect:
  success: false
  stderr_contains:
    - "land failed:"
    - "rejected by origin"
