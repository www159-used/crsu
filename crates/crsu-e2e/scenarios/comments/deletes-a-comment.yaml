name: comments deletes a top-level comment
command: [comments, delete, "CMT:2", "--review", COMMON-99]
crucible:
  project: COMMON
  token: test-token
  review_id: COMMON-99
  comments:
    comments:
      - permaId:
          id: "CMT:2"
        message: Extract this helper
        user:
          userName: bob
  review_items:
    reviewItem: []
  delete:
    comment_id: "CMT:2"
expect:
  success: true
  stdout_contains:
    - '"review_id": "COMMON-99"'
    - '"comment_id": "CMT:2"'
    - '"deleted": true'
