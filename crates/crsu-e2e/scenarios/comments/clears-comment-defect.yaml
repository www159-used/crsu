name: comments clears a defect flag
command: [comments, undefect, "CMT:2", "--review", COMMON-99]
crucible:
  project: COMMON
  token: test-token
  review_id: COMMON-99
  comments:
    comments:
      - permaId:
          id: "CMT:2"
        message: Extract this helper
        defectRaised: true
        user:
          userName: bob
  review_items:
    reviewItem: []
  defect:
    comment_id: "CMT:2"
    defect: false
expect:
  success: true
  stdout_contains:
    - '"review_id": "COMMON-99"'
    - '"comment_id": "CMT:2"'
    - '"defect": false'
