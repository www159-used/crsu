name: clean feature branch produces a reviewable patch
repository:
  base_branch: main
  base_files:
    README.md: "base\n"
  feature_branch: feature
  feature_files:
    README.md: "feature\n"
command:
  - diff
  - main
crucible:
  project: COMMON
  token: test-token
  review_id: COMMON-123
expect:
  success: true
  stdout_contains:
    - "Base: main"
    - "Commits: 1"
    - "Patch bytes: "
    - "Review: COMMON-123"
