name: existing review receives the patch and follows the Git subject
repository:
  base_branch: main
  base_files:
    README.md: "base\n"
  feature_branch: feature
  feature_files:
    README.md: "feature\n"
  feature_message: |-
    fix: current Git title

    Url: http://crucible/cru/COMMON-123
command:
  - diff
  - main
crucible:
  project: COMMON
  repository: java-common
  token: test-token
  review_id: COMMON-123
  current_title: "fix: old review title"
  new_title: "fix: current Git title"
expect:
  success: true
  stdout_contains:
    - "Review: COMMON-123"
