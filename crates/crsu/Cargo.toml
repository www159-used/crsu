[package]
name = "crsu"
version = "0.1.0"
edition = "2024"
description = "A focused Git and Crucible review workflow CLI"
license = "AGPL-3.0-or-later"
keywords = ["git", "crucible", "code-review", "cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"

[features]
test-support = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip", "brotli", "deflate"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
httpmock = "0.7"
serde_yaml = "0.9"
tempfile = "3.15"

[lints]
workspace = true
