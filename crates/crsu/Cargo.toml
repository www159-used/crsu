[package]
name = "crsu"
version.workspace = true
edition.workspace = true
description = "A focused Git and Crucible review workflow CLI"
license.workspace = true
keywords = ["git", "crucible", "code-review", "cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"

[features]
test-support = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip", "brotli", "deflate"] }
arboard = "3"
ratatui = "0.30"
serde.workspace = true
serde_json.workspace = true
toml = "0.9"

[dev-dependencies]
crsu-testkit.workspace = true
httpmock.workspace = true
tempfile.workspace = true

[lints]
workspace = true
